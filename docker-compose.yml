version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: webflexi-postgres
    environment:
      POSTGRES_DB: webflexi_db
      POSTGRES_USER: webflexi_user
      POSTGRES_PASSWORD: webflexi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webflexi_user -d webflexi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: webflexi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PeerJS Server (for video calls)
  peerjs:
    image: peerjs/peerjs-server
    container_name: webflexi-peerjs
    ports:
      - "9000:9000"
    environment:
      - PEERJS_PORT=9000
    restart: unless-stopped

  # pgAdmin (Database GUI - Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: webflexi-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@webflexi.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
